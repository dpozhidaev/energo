name: Peski daily outage check
on:
  schedule:
    - cron: '45 11 * * *' # 11:45 Europe/Moscow
      timezone: "Europe/Moscow"
    - cron: '45 17 * * *' # 17:45 Europe/Moscow
      timezone: "Europe/Moscow"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check site without sending notifications'
        type: boolean
        default: true
      test_message:
        description: 'Send a test message instead of checking the site'
        type: boolean
        default: false
      sample_message:
        description: 'Send a sample outage message (current wording/format) instead of checking the site'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: peski-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Send test message
        if: github.event_name == 'workflow_dispatch' && inputs.test_message && !inputs.sample_message
        run: python monitor.py --test-message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ERROR_CHAT_ID: ${{ secrets.TELEGRAM_ERROR_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
      - name: Send sample outage message
        if: github.event_name == 'workflow_dispatch' && inputs.sample_message
        run: python monitor.py --sample-message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
      - name: Check without sending
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run && !inputs.test_message && !inputs.sample_message
        run: python monitor.py --dry-run
      - name: Send notifications
        if: github.event_name != 'workflow_dispatch' || (!inputs.dry_run && !inputs.test_message && !inputs.sample_message)
        run: python monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ERROR_CHAT_ID: ${{ secrets.TELEGRAM_ERROR_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
      - name: Save sent-notifications state
        if: always() && (github.event_name != 'workflow_dispatch' || (!inputs.dry_run && !inputs.test_message && !inputs.sample_message))
        run: |
          if ! git diff --quiet -- sent.json; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add sent.json
            git commit -m 'Update sent-notifications state'
            git push
          fi
