name: Peski daily outage check
# Плановый запуск GitHub отключён: он опаздывал на часы. Проверку в нужное время запускает
# внешний планировщик (cron-job.org) через workflow_dispatch — см. README.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check site without sending notifications'
        type: boolean
        default: true
      test_message:
        description: 'Send a test message instead of checking the site'
        type: boolean
        default: false
      sample_message:
        description: 'Send a sample outage message to the owner chat only (not the channel)'
        type: boolean
        default: false
      source:
        description: 'Name of the external scheduler that triggered this run (e.g. cron-job.org); empty for a manual run'
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: peski-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: deps
        run: pip install -r requirements.txt
      - id: tests
        run: python -m unittest discover -s tests -v
      - name: Send test message
        if: github.event_name == 'workflow_dispatch' && inputs.test_message && !inputs.sample_message
        run: python monitor.py --test-message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ERROR_CHAT_ID: ${{ secrets.TELEGRAM_ERROR_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
      - name: Send sample outage message
        if: github.event_name == 'workflow_dispatch' && inputs.sample_message
        run: python monitor.py --sample-message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ERROR_CHAT_ID: ${{ secrets.TELEGRAM_ERROR_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
      - name: Check without sending
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run && !inputs.test_message && !inputs.sample_message
        run: python monitor.py --dry-run
        env:
          RUN_TRIGGER: ${{ inputs.source }}
      - name: Send notifications
        if: github.event_name != 'workflow_dispatch' || (!inputs.dry_run && !inputs.test_message && !inputs.sample_message)
        run: python monitor.py
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
          RUN_TRIGGER: ${{ inputs.source }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ERROR_CHAT_ID: ${{ secrets.TELEGRAM_ERROR_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
      - name: Save state and run log
        if: always() && (github.event_name != 'workflow_dispatch' || (!inputs.dry_run && !inputs.test_message && !inputs.sample_message))
        run: |
          git add sent.json runs.log
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update state and run log'
            git pull --rebase -q origin main
            git push
          fi
      # monitor.py сам сообщает об ошибках проверки; этот шаг — про то, до чего он не дошёл.
      - name: Notify owner about a broken run
        if: always() && (steps.deps.outcome == 'failure' || steps.tests.outcome == 'failure' || cancelled())
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ERROR_CHAT_ID: ${{ secrets.TELEGRAM_ERROR_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ERROR_CHAT_ID" ]; then
            curl -sS -o /dev/null --max-time 30 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_ERROR_CHAT_ID}" \
              --data-urlencode "text=⚠️ Ошибка E98: сбой окружения запуска в Actions (установка, тесты или обрыв по времени). Проверка отключений не выполнена. Журнал: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
